<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Job Matcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 38px;
        }

        .header p {
            color: #6b7280;
            font-size: 17px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
        }

        textarea {
            width: 100%;
            min-height: 220px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            resize: vertical;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .info {
            background: #eff6ff;
            padding: 15px;
            border-radius: 10px;
            color: #1e40af;
            margin-bottom: 20px;
        }

        .footer {
            text-align: center;
            color: #6b7280;
            margin-top: 25px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AI Resume Job Matcher</h1>
        <p>Analyze how well a resume matches a job description using Machine Learning.</p>
    </div>

    <div class="card">

        <div class="info">
            Upload a resume and provide the job description to analyze the match.
        </div>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label for="resume">
                    Upload Resume
                </label>

                <input
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,.docx"
                    required
                >
            </div>

            <div class="form-group">
                <label for="job_description">
                    Job Description
                </label>

                <textarea
                    id="job_description"
                    name="job_description"
                    placeholder="Paste the complete job description here..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="button">
                Analyze Resume
            </button>

        </form>

    </div>

    <div class="footer">
        AI Resume Job Matcher | Machine Learning Project
    </div>

</div>

</body>
</html>
